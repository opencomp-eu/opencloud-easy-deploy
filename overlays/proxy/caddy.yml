---
services:
  caddy:
    image: caddy:2-alpine
    container_name: opencloud_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${OCD_CADDYFILE}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - opencloud-net

volumes:
  caddy_data:
  caddy_config:
