---
services:
  opencloud:
    environment:
      # Server-side WOPI discovery over the Docker network (no Caddy/hairpin needed).
      COLLABORATION_APP_ADDR: http://euro-office
      COLLABORATION_APP_INSECURE: "true"
      COLLABORATION_APP_ICON: https://${EURO_OFFICE_DOMAIN}/web-apps/apps/documenteditor/main/resources/img/favicon.ico
      COLLABORATION_JWT_SECRET: ${EURO_OFFICE_JWT_SECRET}
      COLLABORATION_WOPI_SECRET: ${EURO_OFFICE_JWT_SECRET}

  euro-office:
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${EURO_OFFICE_JWT_SECRET}
      WOPI_ENABLED: "true"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - ${EURO_OFFICE_DATA_DIR}:/var/www/euro-office/Data
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "curl -sf http://127.0.0.1/healthcheck | grep -q true",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
