---
services:
  opencloud:
    depends_on:
      euro-office:
        condition: service_healthy
    environment:
      # Public URL via Caddy — correct Host header and discovery XML action URLs for browsers.
      COLLABORATION_APP_ADDR: https://${EURO_OFFICE_DOMAIN}
      COLLABORATION_APP_INSECURE: "false"
      COLLABORATION_APP_ICON: https://${EURO_OFFICE_DOMAIN}/web-apps/apps/documenteditor/main/resources/img/favicon.ico
      COLLABORATION_APP_PROOF_DISABLE: "true"
      # WOPI + Euro Office JWT — must match euro-office JWT_SECRET (NOT COLLABORATION_JWT_SECRET,
      # which aliases OC_JWT_SECRET and breaks REVA token validation inside WOPI access tokens).
      COLLABORATION_WOPI_SECRET: ${EURO_OFFICE_JWT_SECRET}

  euro-office:
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${EURO_OFFICE_JWT_SECRET}
      WOPI_ENABLED: "true"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - ${EURO_OFFICE_DATA_DIR}:/var/www/euro-office/Data
      - ${EURO_OFFICE_CONFIG_DIR}:/etc/euro-office/documentserver
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/80 && printf 'GET /hosting/discovery HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | head -1 | grep -q '200 OK'",
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s
